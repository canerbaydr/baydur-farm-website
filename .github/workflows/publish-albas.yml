name: Publish Albas to Cloudflare Pages

on:
  push:
    branches: [albas-oto-kaporta]
    paths:
      - 'dist/**'
      - 'scripts/configure-seo.mjs'
      - '.github/workflows/publish-albas.yml'

permissions:
  contents: read

concurrency:
  group: albas-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/albas-oto-kaporta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Albas branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure production SEO
        run: node scripts/configure-seo.mjs
        env:
          SITE_URL: https://albasotokaporta.pages.dev
      - name: Publish Albas production site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.81.0'
          command: pages deploy dist --project-name=albasotokaporta --branch=main --commit-hash=${{ github.sha }}
